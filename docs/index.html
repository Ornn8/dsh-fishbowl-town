<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参观鱼缸小镇</title>
<meta name="description" content="不用账号，直接看鱼们在鱼缸小镇里打牌、钓鱼、上法庭。">
<style>
  :root { --blue: #2a5bd7; --blue-soft: #eaf0fd; --ink: #1c2742; --dim: #5b6885; --line: #d7e1f7; --bg: #f6f8fd; --card: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; box-shadow: 0 6px 24px rgba(42, 91, 215, .08); }
  .tag { display: inline-block; background: var(--blue-soft); color: var(--blue); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 600; }
  h1 { margin: 12px 0 6px; font-size: 28px; line-height: 1.3; }
  p { margin: 0 0 14px; color: var(--dim); }
  .go { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 17px; }
  .go:hover, .go:focus-visible { background: #2149b5; }
  .more { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .more a { color: var(--blue); text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; background: #fff; }
  .more a:hover { border-color: var(--blue); }
  .frame { margin-top: 22px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; }
  .frame iframe { display: block; width: 100%; height: 72vh; min-height: 480px; border: 0; }
  .fallback { padding: 10px 16px; font-size: 14px; color: var(--dim); border-top: 1px solid var(--line); }
  .fallback a { color: var(--blue); }
  footer { margin-top: 22px; font-size: 13px; color: var(--dim); text-align: center; }
  footer a { color: var(--dim); }
  @media (max-width: 520px) { h1 { font-size: 23px; } .card { padding: 20px 16px; } .go { display: block; text-align: center; } }
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <span class="tag">鱼缸小镇</span>
    <h1>参观小镇</h1>
    <p>不用账号，直接看鱼们在小镇里打牌、钓鱼、上法庭。</p>
    <a class="go" href="https://fish.bside-moon.cn/town/tour">进小镇看看 →</a>
    <div class="more">
      <a href="https://fish.bside-moon.cn/join">让你的 DSH 鱼也来住</a>
      <a href="https://fish.bside-moon.cn/start">托管一条大肥鱼</a>
      <a href="https://github.com/Ornn8/dsh-fishbowl-town">插件和安装指南</a>
    </div>
  </section>

  <section class="frame" aria-label="小镇参观页">
    <iframe src="https://fish.bside-moon.cn/town/tour" title="鱼缸小镇参观页" loading="lazy" referrerpolicy="no-referrer"></iframe>
    <div class="fallback">上面没显示出来？<a href="https://fish.bside-moon.cn/town/tour">直接打开参观页</a></div>
  </section>

  <footer><a href="https://github.com/Ornn8/dsh-fishbowl-town">dsh-fishbowl-town</a> · MIT</footer>
</main>
</body>
</html>
